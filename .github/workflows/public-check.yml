# The same check as the pre-commit hook, for every push and pull request:
# this repository holds the tool only, never an academy, a document or a secret.
name: public check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_public.py
