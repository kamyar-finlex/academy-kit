server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page's AI features ask the Ollama on the host, never an outside service.
  # Only the chat call is exposed, so the page cannot pull, delete or list models.
  # Ollama refuses browser origins it does not know, so Origin is dropped and Host set to loopback.
  location = /ai/chat {
    limit_except POST { deny all; }
    proxy_pass http://host.docker.internal:11434/api/chat;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:11434;
    proxy_set_header Origin "";
    proxy_read_timeout 180s;
    client_max_body_size 256k;
  }

  # "Listen": the page asks the kit's natural voice on the host (speak_server.py, 127.0.0.1:8770).
  # Only these two calls are exposed. The text never leaves this computer.
  location = /speak {
    limit_except POST { deny all; }
    proxy_pass http://host.docker.internal:8770/speak;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8770;
    proxy_set_header Origin "";
    proxy_read_timeout 120s;
    client_max_body_size 16k;
  }
  location = /speak/voices {
    limit_except GET { deny all; }
    proxy_pass http://host.docker.internal:8770/voices;
    proxy_set_header Host 127.0.0.1:8770;
    add_header Cache-Control "no-store";
  }

  # Content changes when the academy is rebuilt; always revalidate.
  location ~* \.(html|js|css|json)$ {
    add_header Cache-Control "no-cache";
  }

  location ^~ /videos/ {
    add_header Cache-Control "no-cache";
    # WebVTT is not in nginx's default mime.types; a types block replaces the whole table,
    # so it is set only for .vtt files.
    location ~ \.vtt$ { types { } default_type text/vtt; }
  }
}
