# Optional: keep an academy online on this computer all the time (http://localhost:8765).
#   ACADEMY_SITE=/absolute/path/to/<academy>/site docker compose up -d
# The site folder is mounted read-only, so a rebuild shows up without a restart.
# "Always" depends on Docker Desktop starting at login (Settings → General).
name: academy
services:
  web:
    image: nginx:1.31.8-alpine
    container_name: academy
    restart: always
    ports:
      - "127.0.0.1:${ACADEMY_PORT:-8765}:80"
    volumes:
      - ${ACADEMY_SITE:?set ACADEMY_SITE to the built site folder}:/usr/share/nginx/html:ro
      - ./conf.d:/etc/nginx/conf.d:ro  # a folder, so editing the file in place is picked up by "nginx -s reload"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
